<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Placar Comercial</title>
<style>
html,body{margin:0;background:#1A0C05;color:#F5ECD7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.c{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.c b{font-size:20px}
.c p{margin:8px 0 0;color:#A68B70;font-size:14px}
.c button{margin-top:14px;padding:10px 18px;border-radius:8px;border:1px solid #56381F;background:#2F1B0E;color:#F5ECD7;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="c"><div><b>Placar Comercial</b><p id="msg">Abrindo…</p></div></div>
<script>
/* Página de entrada do placar. A tela e os dados vêm do Apps Script; nada é guardado aqui. */
window.PLACAR_API = 'https://script.google.com/macros/s/AKfycbyyzPE_P5c1JRM6JA8zZbopTkhCquKsjaeilwjZ2_79hIY_4MbP9oTr9Rkt9YiDArKY7Q/exec';
fetch(window.PLACAR_API, { method: 'POST', body: JSON.stringify({ fn: 'tela', args: [] }) })
  .then(function (r) { return r.json(); })
  .then(function (o) {
    if (!o || typeof o.ok !== 'string') throw new Error((o && o.err) || 'sem tela');
    document.open();
    document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' + o.ok);
    document.close();
  })
  .catch(function () {
    document.getElementById('msg').innerHTML = 'Não consegui abrir agora.<br><button onclick="location.reload()">Tentar de novo</button>';
  });
</script>
</body>
</html>
